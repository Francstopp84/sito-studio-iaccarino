<script>
(function(){
  var w=document.getElementById('wa-float');if(!w)return;
  var GAP=16,BASE=92;
  function ck(){return document.querySelector('.cookie-banner');}
  function adj(){
    if(window.innerWidth>900){w.style.bottom='';return;}
    var c=ck(),h=0;
    if(c){var r=c.getBoundingClientRect();
      if(r.height>0&&r.top<window.innerHeight-2){h=window.innerHeight-r.top;}}
    w.style.bottom=(h>0?Math.round(h)+GAP:BASE)+'px';
  }
  adj();
  window.addEventListener('resize',adj);
  window.addEventListener('scroll',adj,{passive:true});
  var c=ck();
  if(c){
    c.addEventListener('transitionend',adj);
    try{new MutationObserver(adj).observe(c,{attributes:true,attributeFilter:['class','style']});}catch(e){}
    try{new ResizeObserver(adj).observe(c);}catch(e){}
  }
  document.addEventListener('click',function(){setTimeout(adj,80);setTimeout(adj,500);},true);
  [300,900,2000,3200].forEach(function(t){setTimeout(adj,t);});
})();
</script>
